name: Comment PR Validation Results

on:
  workflow_run:
    workflows: ["Validate Pull Request"]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
    - name: Download validation artifacts
      uses: actions/download-artifact@v4
      with:
        name: validation-results
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Comment PR with validation results
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const { owner, repo } = context.repo;
          const commentIdentifier = "<!-- GHA VALIDATION RESULTS -->";

          const pr_number = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim());
          const validation_success = fs.readFileSync('validation_success.txt', 'utf8').trim();
          const isSuccess = validation_success === 'true' && '${{ github.event.workflow_run.conclusion }}' === 'success';

          let commentBody;
          if (isSuccess) {
            commentBody = `## ✅ Validation Results - PASSED

${commentIdentifier}

All validation tests passed successfully! 🎉`;
          } else {
            let errorDetails = 'An unexpected error occurred.';
            if (fs.existsSync('combined_output.txt')) {
              errorDetails = fs.readFileSync('combined_output.txt', 'utf8');
            }

            commentBody = `## ❌ Validation Results - FAILED

${commentIdentifier}

<details>
<summary>Click to see detailed failure results</summary>

\`\`\`
${errorDetails}
\`\`\`

</details>

⚠️ Some validation tests failed. Please review the results above and fix any issues.`;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: pr_number,
          });

          const existingComment = comments.find(c => c.body.includes(commentIdentifier));

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existingComment.id,
              body: commentBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: commentBody,
            });
          }
