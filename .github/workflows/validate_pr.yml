name: Validate Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run shellcheck on all bash scripts
      run: |
        echo "Running shellcheck on bash scripts..."
        
        # Find all .sh files and the main script
        SCRIPTS=$(find . -type f \( -name "*.sh" -o -path "*/bin/is-my-code-great" \) \
          ! -path "./tmp/*" \
          ! -path "./.git/*" \
          ! -path "./node_modules/*")
        
        FAILED=0
        for script in $SCRIPTS; do
          echo "Checking: $script"
          if ! shellcheck "$script"; then
            FAILED=1
            echo "::error file=$script::ShellCheck found issues in $script"
          fi
        done
        
        if [ $FAILED -eq 1 ]; then
          echo "::error::ShellCheck found issues in one or more scripts"
          exit 1
        fi
        
        echo "✅ All scripts passed shellcheck"

    - name: Print bash version
      run: bash --version

    - name: Run validation on all example languages
      id: validate_examples
      run: |
        LANGUAGES=$(ls -d examples/*/ | sed 's|examples/||; s|/||' | grep -v '^dart2$')
        echo "Running validation on languages: $LANGUAGES"

        OVERALL_SUCCESS=true
        rm -f combined_output.txt # clean up from previous runs

        for LANGUAGE in $LANGUAGES; do
          echo "::group::Validating $LANGUAGE examples"
          # Run validation and capture output to file
          if ./test/validate_results.sh "$LANGUAGE" > "validation_${LANGUAGE}_output.txt" 2>&1; then
            echo "✅ $LANGUAGE validation passed"
            cat "validation_${LANGUAGE}_output.txt"
          else
            echo "❌ $LANGUAGE validation failed"
            OVERALL_SUCCESS=false
            cat "validation_${LANGUAGE}_output.txt"
            # Create annotation for failed language
            echo "::error::Validation failed for $LANGUAGE. See output above for details."
          fi
          echo "::endgroup::"

          # Append to combined output for PR comment
          {
            echo "### $LANGUAGE Results:"
            cat "validation_${LANGUAGE}_output.txt"
            echo ""
          } >> combined_output.txt
        done

        if [ "$OVERALL_SUCCESS" = "true" ]; then
          echo "validation_success=true" >> $GITHUB_OUTPUT
          echo "All validations passed successfully!"
        else
          echo "validation_success=false" >> $GITHUB_OUTPUT
          echo "Some validations failed!"
        fi

    - name: Save PR metadata for comment workflow
      if: always()
      run: |
        echo "${{ github.event.pull_request.number }}" > pr_number.txt
        echo "${{ steps.validate_examples.outputs.validation_success }}" > validation_success.txt

    - name: Fail job if validation failed
      if: steps.validate_examples.outputs.validation_success == 'false'
      run: |
        exit 1

    - name: Upload validation results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: |
          validation_*_output.txt
          combined_output.txt
          pr_number.txt
          validation_success.txt
        retention-days: 7